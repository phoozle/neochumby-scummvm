# Every push and pull request: the host test mode (format, lints, tests),
# the Chumby's binary (zig 0.17 and armv5te-unknown-linux-musleabi, as
# neochumby's CI builds), a smoke test of it under qemu, and a neochumby
# tree with it installed, as tools/tree lays it out. No game data is used
# or needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.17.0
  # neochumby with the session from PRs #15-#17 (proposal 0002), whose
  # manifests take `button` and `interrupt`: the head of #17.
  NEOCHUMBY_SESSION_REV: 7a908ef52766ab23baabca4cbc7ab10ff74356c4

jobs:
  host:
    name: Host test mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: The converter's contract (no games here)
        run: |
          b=target/release/neochumby-pajamasam
          if $b check --ps1 /nonexistent; then exit 1; else test $? -eq 2; fi
          if $b bogus; then exit 1; else test $? -eq 1; fi
      - name: ScummVM starts, with the SCUMM engine
        run: |
          target/release/neochumby-scummvm --scummvm --version
          target/release/neochumby-scummvm --scummvm --list-engines | tee engines.txt
          grep -q 'HE71+ games' engines.txt

  chumby:
    name: The Chumby's binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv5te-unknown-linux-musleabi
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: cargo clippy --release --target armv5te-unknown-linux-musleabi -- -D warnings
      - run: cargo build --release --target armv5te-unknown-linux-musleabi
      - name: Size and float use
        run: |
          bin=target/armv5te-unknown-linux-musleabi/release/neochumby-scummvm
          ls -l "$bin"
          file "$bin"
          size "$bin" || true
      # No Chumby here: qemu's user mode runs the binary on the runner's
      # kernel, which proves it starts (static, the CPU's instructions,
      # libc++ and the atomics linked), not that it runs on 2.6.16.
      - name: It starts under qemu-arm
        run: |
          sudo apt-get update -q && sudo apt-get install -yq qemu-user-static
          bin=target/armv5te-unknown-linux-musleabi/release/neochumby-scummvm
          qemu-arm-static -cpu arm926 "$bin" --scummvm --version
          qemu-arm-static -cpu arm926 "$bin" --scummvm --list-engines | tee engines.txt
          grep -q 'HE71+ games' engines.txt
          # No games beside it: it says so and exits 1.
          if qemu-arm-static -cpu arm926 "$bin"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: neochumby-scummvm-armv5te
          path: target/armv5te-unknown-linux-musleabi/release/neochumby-scummvm

  tree:
    name: A neochumby tree with the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: neochumby-scummvm
      - uses: actions/checkout@v4
        with:
          repository: johnmerchant/neochumby
          ref: ${{ env.NEOCHUMBY_SESSION_REV }}
          path: neochumby
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv5te-unknown-linux-musleabi
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: tools/tree with this crate
        working-directory: neochumby
        run: |
          tools/tree "$RUNNER_TEMP/tree" "$GITHUB_WORKSPACE/neochumby-scummvm"
          find "$RUNNER_TEMP/tree" -type f | sort
          cat "$RUNNER_TEMP/tree/apps/scummvm/manifest"
